[project]
name = "movie-rec-sys"
version = "0.1.0"
description = "FIAP Tech Challenge 02 — MovieLens 20M recommendation system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # HTTP / data I/O
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=18.0",
    # Config
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Scientific core (Etapa 4 — modelo + baselines)
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # PyTorch — resolve from PyPI (CPU on macOS Intel/ARM, GPU-optional on Linux)
    "torch>=2.4",
    # Experiment tracking + model registry (Etapa 3)
    "mlflow>=2.18",
    # Pipeline & data versioning (Etapa 3)
    "dvc>=3.56",
    # Feature engineering — BERTopic (Etapa 3 / feature_eng stage)
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
# DVC with cloud storage backends (Etapa 3 — remote opcional)
s3 = ["dvc[s3]>=3.56"]
gdrive = ["dvc[gdrive]>=3.56"]

dev = [
    "pre-commit>=3.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
