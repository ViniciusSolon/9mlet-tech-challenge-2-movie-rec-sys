stages:
  preprocess:
    cmd: python scripts/preprocess.py --strategy ${preprocess.strategy}
    deps:
      - scripts/preprocess.py
      - data/raw/ratings.csv
    params:
      - preprocess.strategy
    outs:
      - data/processed/preprocessed_ratings.parquet

  enrich_metadata:
    cmd: python scripts/enrich_metadata.py
    deps:
      - scripts/enrich_metadata.py
      - data/raw/movies.csv
      - data/raw/links.csv
      - data/processed/movie_metadata.parquet
    outs:
      - data/processed/enriched_metadata.parquet

  feature_eng:
    cmd: python scripts/feature_engineering.py
    deps:
      - scripts/feature_engineering.py
      - data/processed/preprocessed_ratings.parquet
      - data/processed/enriched_metadata.parquet
    outs:
      - data/processed/features_ratings.parquet

  train:
    cmd: >-
      python scripts/train.py 
      --epochs ${train.epochs} 
      --lr ${train.lr} 
      --batch-size ${train.batch_size} 
      --embedding-dim ${train.embedding_dim} 
      --hidden-dim ${train.hidden_dim}
      --dropout ${train.dropout}
      --model-type ${train.model_type}
      --val-split ${train.val_split}
      --patience ${train.patience}
      --seed ${train.seed}
    deps:
      - scripts/train.py
      - data/processed/features_ratings.parquet
    params:
      - train.epochs
      - train.lr
      - train.batch_size
      - train.embedding_dim
      - train.hidden_dim
      - train.dropout
      - train.model_type
      - train.val_split
      - train.patience
      - train.seed
    outs:
      - models/model.pth

  evaluate:
    cmd: >-
      python scripts/evaluate.py
      --model-type ${train.model_type}
      --experiment-name ${mlflow.experiment_name}
      --registry-model-name ${mlflow.registry_model_name}
    deps:
      - scripts/evaluate.py
      - data/processed/features_ratings.parquet
      - models/model.pth
    params:
      - train.model_type
      - mlflow.experiment_name
      - mlflow.registry_model_name
    metrics:
      - metrics.json:
          cache: false
